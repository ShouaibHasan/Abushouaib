# PSCAD Co-Simulation Configuration File
# Generated by PSCAD for external application co-simulation
# This file contains connection parameters for the Communication Fabric

[COSIMULATION]
# Communication Fabric DLL location
fabric_location=C:\Program Files (x86)\CommunicationFabric\x86\ComFab.dll

# Master process (PSCAD) connection details
hostname=localhost
port=34343

# Client identification
client_id=30001

# Timeout settings (in seconds)
connection_timeout=30
data_timeout=5

[CHANNELS]
# Channel configuration section
# Format: channel_id=send_size,recv_size,description
# channel_id: Unique identifier for the channel (must match PSCAD setup)
# send_size: Number of double values this application sends to PSCAD
# recv_size: Number of double values this application receives from PSCAD
# description: Optional description for documentation

10=2,2,Control signals for voltage regulator
20=1,3,Power measurements and reference values
30=4,1,Three-phase currents to single control output

[SIMULATION]
# Simulation parameters
time_step=0.001
start_time=0.0
end_time=1.0

# Data exchange mode
# Options: SYNCHRONOUS, ASYNCHRONOUS
exchange_mode=SYNCHRONOUS

# Interpolation method for time-domain data
# Options: LINEAR, HOLD, CUBIC_SPLINE
interpolation=LINEAR

[LOGGING]
# Enable/disable logging
enable_logging=true
log_level=INFO

# Log file location
log_file=cosim_30001.log

# Log data exchange
log_data_exchange=true

[ADVANCED]
# Advanced settings for experts only

# Buffer size for data exchange (number of time steps)
buffer_size=100

# Enable data validation
validate_data=true

# Retry attempts for failed operations
max_retries=3

# Memory allocation strategy
# Options: STATIC, DYNAMIC
memory_strategy=DYNAMIC